<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>ARENA BET</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(circle at 50% 20%,#1a2850,#070a14 70%);color:#e8ecf6;font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:rgba(14,20,36,.9);border:1px solid #28345a;border-radius:18px;padding:28px;width:100%;max-width:460px;text-align:center;box-shadow:0 20px 60px #000a}
h1{font-size:38px;letter-spacing:5px;background:linear-gradient(90deg,#ffb020,#ff3d5a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.7;font-size:13px;margin:4px 0 20px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#ffb020,#ff3d5a);color:#111;font-weight:900;font-size:17px;letter-spacing:2px;cursor:pointer}
button.g{background:transparent;border:1px solid #3a4a66;color:#e8ecf6;font-size:14px;letter-spacing:1px;padding:11px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #28345a;background:#0b1226;color:#fff;font-size:15px;text-align:center;margin:8px 0}
.sec{margin-top:18px;padding-top:16px;border-top:1px solid #ffffff14}
.help{font-size:12px;opacity:.65;line-height:1.6;margin-top:6px}
button.on{background:linear-gradient(90deg,#27d17f,#12a85f);color:#04150c}
button.off{background:linear-gradient(90deg,#ff3d5a,#c4203a);color:#fff}
.st{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;margin:0 0 10px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#555}.dot.on{background:#27d17f;box-shadow:0 0 10px #27d17f}
#err{color:#ff3d5a;font-weight:700;font-size:13px;margin:10px 0 0;min-height:16px}
</style></head><body><div class="card">
<h1>ARENA BET</h1><div class="sub">Tiro 3D · 1v1 online</div>
<div class="st"><span class="dot" id="dot"></span><span id="stt">Servidor desligado</span></div>
<button id="srv" class="on" style="margin-bottom:10px">LIGAR SERVIDOR</button>
<button id="play">JOGAR</button>
<div class="help" id="ips">Quem clicar em JOGAR também vira servidor para o amigo entrar.</div>
<div class="sec"><div class="help" style="margin:0 0 4px">Entrar no jogo de um amigo (servidor dele)</div>
<input id="addr" placeholder="IP do amigo, ex: 192.168.0.10:3000" autocomplete="off"><button class="g" id="join">ENTRAR NO SERVIDOR</button></div>
<div id="err"></div>
<div class="sec"><div class="help" style="margin:0 0 4px">Modo gráfico (mude só se estiver travando)</div>
<select id="ang"><option value="auto">Automático</option><option value="d3d11">Direct3D 11</option><option value="gl">OpenGL</option><option value="d3d9">Direct3D 9</option></select>
<div class="help">Dentro do jogo: F11 tela cheia · F10 volta para este menu</div></div>
</div><script>
const e=s=>document.getElementById(s),A=window.arena;
const h=decodeURIComponent((location.hash.match(/err=(.*)/)||[])[1]||'');if(h)e('err').textContent=h;
const paint=i=>{const on=!!i.running;e('dot').className='dot'+(on?' on':'');
 e('srv').textContent=on?'DESLIGAR SERVIDOR':'LIGAR SERVIDOR';e('srv').className=on?'off':'on';
 e('stt').textContent=on?'Servidor LIGADO'+(i.ips&&i.ips.length?' — '+i.ips.map(x=>x+':'+i.port).join('  ou  '):''):'Servidor desligado';
 e('ips').textContent=i.ips&&i.ips.length?'Seu endereço para o amigo: '+i.ips.map(x=>x+':'+i.port).join('  ou  '):'Quem clicar em JOGAR também vira servidor para o amigo entrar.'};
if(A){A.info().then(i=>{if(!i)return;e('ang').value=i.angle;paint(i)});
 e('srv').onclick=async()=>{const on=e('srv').className==='on';e('err').textContent='';const r=await A.server(on);if(r){paint(r);e('err').textContent=r.err||''}};
 e('play').onclick=async()=>{e('err').textContent=await A.play()||''};
 e('join').onclick=async()=>{e('err').textContent=await A.join(e('addr').value)||''};
 e('ang').onchange=()=>A.angle(e('ang').value)}
else e('err').textContent='Abra este menu pelo app (npm start).';
</script></body></html>
